paths: # 所有路径配置
  mimic_dir: &mimic_dir datasets/mimic3/csv # MIMIC-III csv 文件目录
  static_dir: &static_dir datasets/mimic3/static # 静态资源目录
  dataset_dir: &dataset_dir datasets/mimic3_rare50 # 预处理后数据集目录
  word2vec_dir: &word2vec_dir datasets/mimic3_rare50/word2vec # Word2Vec 模型目录
  output_dir: &output_dir results/MultiResCNN_mimic3_rare50 # 训练输出目录

dataset: # 数据集配置
  name: base_dataset # 数据集类名称
  data_common: &data_common
    column_names: # 各字段名称
      hadm_id: "HADM_ID" # 住院号字段
      clinical_note: "TEXT" # 文本字段
      labels: "LABELS" # 标签字段
    word2vec_dir: *word2vec_dir # 词向量目录
    pad_token: "<pad>" # padding 标记
    unk_token: "<unk>" # 未知词标记
    dataset_dir: *dataset_dir # 数据集存放目录
    label_file: labels.json # 标签映射文件
    max_length: 2500 # 文本截断长度
  params:
    train:
      <<: *data_common # 继承通用配置
      data_file: train.json # 训练数据文件
    val:
      <<: *data_common # 继承通用配置
      data_file: val.json # 验证数据文件
    test:
      <<: *data_common # 继承通用配置
      data_file: test.json # 测试数据文件

model: # 模型相关设置
  name: multirescnn # 模型名称
  params:
    version: mimic3 # 数据集版本
    dataset_dir: *dataset_dir # 数据目录
    mimic_dir: *mimic_dir # 原始 MIMIC CSV 目录
    static_dir: *static_dir # 静态文件目录
    word2vec_dir: *word2vec_dir # 词向量目录
    embed_file: processed_full.embed # 词向量文件名
    conv_layer: 1 # 残差卷积层数
    num_classes: 50 # 标签数量
    filter_size: [3, 5, 9, 15, 19, 25] # 不同卷积核尺寸
    test_model: None # 预训练模型路径
    num_filter_maps: 50 # 卷积通道数
    dropout: 0.2 # dropout 比例
    use_ext_emb: false # 是否使用外部词向量

trainer: # 训练器配置
  name: base_trainer # 使用的训练器名称
  params:
    output_dir: *output_dir # 输出目录
    data_loader:
      batch_size: 16 # 每批样本数
      num_workers: 4 # 数据加载进程
      shuffle: true # 是否打乱数据
      drop_last: false # 是否丢弃末尾不足批次
    loss:
      name: BinaryCrossEntropyLoss # 损失函数
      params: null # 额外参数
    optimizer:
      name: adam # 优化器类型
      params:
        lr: 0.0001 # 学习率
        weight_decay: 0.0 # 权重衰减
    max_epochs: 200 # 最大训练轮数
    lr_scheduler: null # 学习率调度策略
    stopping_criterion:
      metric:
        name: prec_at_5 # 监控指标
      desired: max # 指标越大越好
      patience: 10 # 早停耐心
    checkpoint_saver:
      name: base_saver # 模型保存器
      params:
        checkpoint_dir: *output_dir # 保存目录
        interval: 1 # 保存间隔
        max_to_keep: 5 # 最多保留文件数
        ckpt_fname_format: "ckpt-{}.pth" # 普通模型文件名
        best_fname_format: "best-{}.pth" # 最佳模型文件名
        metric:
          name: prec_at_5 # 最佳标准
          class: prec_at_k # 指标类
          params:
            k: 5 # k 值
        desired: max # 指标越大越好
    eval_metrics: &eval_metrics
      - name: prec_at_5 # 评估指标 top-5
        class: prec_at_k
        params:
          k: 5
      - name: prec_at_8 # 评估指标 top-8
        class: prec_at_k
        params:
          k: 8
      - name: macro_f1 # 宏 F1
      - name: micro_f1 # 微 F1
      - name: macro_auc # 宏 AUC
      - name: micro_auc # 微 AUC
    graph:
      writer:
        name: tensorboard # 日志写入器
        params:
          log_dir: *output_dir # 日志目录
      train:
        interval: 100 # 训练日志间隔
        interval_unit: step # 以步为单位
        metric:
          - name: loss # 记录损失
      val:
        interval: 1 # 验证日志间隔
        interval_unit: epoch # 以轮为单位
        metric:
          - name: loss # 记录损失
          - name: prec_at_5 # top-5 精度
          - name: prec_at_8 # top-8 精度
          - name: macro_f1 # 宏 F1
          - name: micro_f1 # 微 F1
          - name: macro_auc # 宏 AUC
          - name: micro_auc # 微 AUC
    seed: 1337 # 随机种子
    use_gpu: true # 是否使用 GPU
